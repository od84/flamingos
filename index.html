<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper Mentor AI | Research Mentoring for Ambitious Students</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        :root {
            --navy-deep: #0B1F3A;
            --navy-soft: #12284A;
            --gold: #CBA45B;
            --gold-soft: #E3CFA1;
            --bg-light: #F4F6FB;
            --card-bg: #E8EEF8;
            --text-main: #1B1F2A;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-main);
        }

        /* NAVIGATION */
        nav {
            background: var(--navy-deep);
            padding: 1em 1.8em;
            display: flex;
            justify-content: center;
            gap: 2em;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 4px 18px rgba(0,0,0,0.35);
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            position: relative;
            font-size: 1.02em;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -0.28em;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.25s ease;
        }

        nav a:hover::after,
        nav a.active::after {
            width: 100%;
        }

        /* HERO */
        .hero {
            padding: 5.5em 1.5em 4.8em;
            text-align: center;
            background: radial-gradient(circle at top left, #24406A, #0B1F3A 60%, #050815 100%);
            color: white;
        }

        .hero-inner {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255,255,255,0.06);
            border-radius: 26px;
            padding: 3.4em 3em;
            box-shadow: 0 28px 90px rgba(0,0,0,0.55);
            backdrop-filter: blur(22px);
        }

        .hero-logo {
            width: 360px;
            max-width: 90%;
            margin-bottom: 2.2em;
        }

        .hero-tagline {
            text-transform: uppercase;
            letter-spacing: 0.22em;
            font-size: 0.82em;
            color: #dce2ff;
            margin-bottom: 1em;
        }

        /* Ivy League Banner */
        .ivy-banner {
            background: linear-gradient(90deg, #F7E7B2, #CBA45B);
            color: #1B1F2A;
            padding: 0.8em 1.2em;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95em;
            display: inline-block;
            margin-bottom: 1.4em;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }

        .hero-title {
            font-family: 'Merriweather', serif;
            font-weight: 700;
            font-size: 2.55em;
            margin-bottom: 0.5em;
            line-height: 1.25;
        }

        .hero-subtitle {
            font-size: 1.12em;
            max-width: 650px;
            margin: 1em auto 2.2em;
            line-height: 1.75;
            color: #e8eeff;
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1em;
        }

        .btn-primary, .btn-ghost {
            border-radius: 999px;
            padding: 1em 2em;
            font-size: 1em;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.6em;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.22s ease;
        }

        .btn-primary {
            background: var(--gold);
            color: var(--navy-deep);
            box-shadow: 0 14px 30px rgba(0,0,0,0.28);
        }

        .btn-primary:hover {
            background: var(--gold-soft);
            transform: translateY(-2px);
            box-shadow: 0 18px 42px rgba(0,0,0,0.38);
        }

        .btn-ghost {
            background: transparent;
            color: #f4f7ff;
            border: 1px solid rgba(255,255,255,0.45);
        }

        .btn-ghost:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
        }

        /* MAIN */
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3.4em 1.4em 3.8em;
        }

        h2.section-title {
            font-family: 'Merriweather', serif;
            font-size: 1.85em;
            margin-bottom: 0.5em;
            color: var(--navy-deep);
        }

        .section-subtitle {
            font-size: 1.05em;
            color: #50576a;
            margin-bottom: 1.4em;
        }

        /* CARD */
        .card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 2em;
            border-left: 6px solid var(--gold);
            box-shadow: 0 14px 30px rgba(0,0,0,0.08);
        }

        .card ul {
            padding-left: 1.2em;
        }

        .card li {
            margin-bottom: 0.75em;
            font-size: 1.02em;
            line-height: 1.65;
        }

        .card li i {
            color: var(--gold);
            margin-right: 0.55em;
        }

        /* PROJECT GRID */
        .projects-grid {
            list-style: none;
            padding: 0;
            display: grid;
            gap: 0.6em;
        }

        footer {
            background: #020511;
            color: #b3b9d4;
            text-align: center;
            padding: 2em;
        }
    </style>
</head>
