<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Mentor AI | Research Mentoring for Ambitious Students</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        :root {
            --navy-deep: #0B1F3A;
            --navy-soft: #12284A;
            --gold: #CBA45B;
            --gold-soft: #DCC394;
            --bg-light: #F4F6FB;
            --card-bg: #E8EEF8;
            --text-main: #1B1F2A;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-light);
            color: var(--text-main);
        }

        /* NAVIGATION */
        nav {
            background: var(--navy-deep);
            padding: 0.9em 1.5em;
            display: flex;
            justify-content: center;
            gap: 1.8em;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.98em;
            position: relative;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -0.35em;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.25s ease;
        }

        nav a:hover::after,
        nav a.active::after {
            width: 100%;
        }

        /* HERO */
        .hero {
            padding: 5em 1.5em 4.5em;
            text-align: center;
            background: radial-gradient(circle at top left, #1F3A68, #0B1F3A 55%, #050815 100%);
            color: white;
        }

        .hero-inner {
            max-width: 900px;
            margin: 0 auto;
            background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
            border-radius: 24px;
            padding: 3em 3.2em;
            box-shadow: 0 24px 80px rgba(0,0,0,0.45);
            backdrop-filter: blur(20px);
        }

        .hero-logo {
            width: 360px;
            max-width: 90%;
            border-radius: 22px;
            margin-bottom: 2.2em;
        }

        .hero-title {
            font-family: 'Merriweather', serif;
            font-weight: 700;
            font-size: 2.4em;
            margin: 0 0 0.4em;
        }

        .hero-subtitle {
            font-size: 1.05em;
            max-width: 640px;
            margin: 0 auto 2em;
            line-height: 1.7;
            color: #e7ecff;
        }

        .hero-tagline {
            text-transform: uppercase;
            letter-spacing: 0.22em;
            font-size: 0.76em;
            margin-bottom: 1.2em;
            color: #d0d6f0;
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.8em;
        }

        .btn-primary,
        .btn-ghost {
            border-radius: 999px;
            padding: 0.9em 1.8em;
            font-size: 0.98em;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5em;
            transition: all 0.22s ease;
        }

        .btn-primary {
            background: var(--gold);
            color: var(--navy-deep);
            box-shadow: 0 12px 30px rgba(0,0,0,0.28);
        }

        .btn-primary:hover {
            background: var(--gold-soft);
            transform: translateY(-1px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.38);
        }

        .btn-ghost {
            background: transparent;
            color: #f4f7ff;
            border: 1px solid rgba(255,255,255,0.4);
        }

        .btn-ghost:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.8);
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3.2em 1.5em 3.5em;
        }

        h2.section-title {
            font-family: 'Merriweather', serif;
            font-size: 1.6em;
            margin-bottom: 0.6em;
            color: var(--navy-deep);
        }

        .section-subtitle {
            font-size: 0.98em;
            color: #4f5668;
            margin-bottom: 1.3em;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.8em 1.9em;
            border-left: 5px solid var(--gold);
            box-shadow: 0 12px 26px rgba(11,31,58,0.08);
        }

        .card ul {
            padding-left: 1.2em;
            margin: 0;
        }

        .card li {
            margin-bottom: 0.6em;
            line-height: 1.6;
        }

        .card li i {
            color: var(--gold);
            margin-right: 0.5em;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.55em;
            padding-left: 0;
            list-style: none;
            margin: 0;
        }

        .projects-grid li {
            display: flex;
            align-items: flex-start;
        }

        .projects-grid i {
            margin-right: 0.5em;
            color: var(--gold);
            margin-top: 0.1em;
        }

        .callout {
            margin-top: 1.4em;
            font-size: 0.95em;
            color: #50576a;
        }

        .cta-row {
            margin-top: 1.4em;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8em;
        }

        footer {
            background: #020511;
            color: #b3b9d4;
            text-align: center;
            padding: 1.8em 1.2em;
            font-size: 0.9em;
        }

        @media (max-width: 720px) {
            .hero-inner {
                padding: 2.2em 1.7em;
            }
            .hero-title {
                font-size: 2.05em;
            }
            nav {
                flex-wrap: wrap;
                gap: 1em;
