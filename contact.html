<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact</title>

    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        .contact-section {
            max-width: 800px;
            margin: auto;
            padding: 2.5em 1.5em;
        }
        .contact-card {
            background: #eef4ff;
            padding: 2em;
            border-radius: 12px;
            border-left: 6px solid #4E73DF;
            margin-bottom: 2em;
        }
        form label {
            display: block;
            margin-top: 0.8em;
            font-weight: 500;
        }
        form input, form textarea {
            width: 100%;
            padding: 0.8em;
            margin-top: 0.4em;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
            font-family: inherit;
            box-sizing: border-box;
        }
        form textarea {
            height: 150px;
            resize: vertical;
        }
        .submit-btn {
            margin-top: 1.2em;
            background: #1CC88A;
            color: white;
            padding: 0.8em 1.7em;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .submit-btn:hover {
            background: #17a673;
        }
        .hero-contact {
            background: linear-gradient(135deg, #4E73DF, #1CC88A);
            padding: 3em 2em;
            text-align: center;
            color: white;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
        }
        .success-message {
            padding: 1.2em;
            background: #d4f8e8;
            color: #0b6b3a;
            border-radius: 8px;
            text-align: center;
            margin-top: 1em;
            display: none;
        }
    </style>
</head>

<body>

<div class="hero-contact">
    <h1>Contact Us</h1>
    <p>Reach out for questions, consultations, or program details.</p>
</div>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="programs.html">Programs</a>
    <a href="students.html">Students</a>
    <a href="contact.html">Contact</a>
</nav>

<section class="contact-section">

    <h2><i class="fas fa-envelope"></i> Send Us a Message</h2>

    <div class="contact-card">

        <form id="contactForm" action="https://formspree.io/f/xananvqn" method="POST">
            <label>Your Name</label>
            <input type="text" name="name" required>

            <label>Your Email</label>
            <input type="email" name="email" required>

            <label>Your Message</label>
            <textarea name="message" required></textarea>

            <button class="submit-btn" type="submit">
                <i class="fas fa-paper-plane"></i> Send Message
            </button>
        </form>

        <div id="success" class="success-message">
            ✔ Your message has been sent! We will get back to you soon.
        </div>

    </div>

    <h2><i class="fas fa-info-circle"></i> Or contact us directly</h2>
    <div class="contact-card">
        <p><i class="fas fa-envelope"></i> Email:
            <a href="mailto:papermentorai@gmail.com">papermentorai@gmail.com</a>
        </p>
    </div>

</section>

<footer>
    © 2025 AI Mentoring Program — All Rights Reserved.
</footer>

<script>
    const form = document.getElementById("contactForm");
    const successMessage = document.getElementById("success");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();
        const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
            form.reset();
            successMessage.style.display = "block";
        }
    });
</script>

</body>
</html>
