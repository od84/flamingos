<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now | AI Research Mentoring</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="assets/style.css">

    <style>
        body {
            background: #f8f9ff;
            font-family: 'Roboto', sans-serif;
        }

        .form-container {
            max-width: 820px;
            margin: 2em auto;
            background: white;
            padding: 2.5em;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #4E73DF;
            margin-bottom: 0.5em;
        }

        p.subtitle {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 2em;
            color: #555;
        }

        form label {
            font-weight: 600;
            display: block;
            margin-top: 1.2em;
        }

        form input, form select, form textarea {
            width: 100%;
            padding: 0.9em;
            margin-top: 0.4em;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        .form-section-title {
            font-size: 1.3em;
            margin-top: 2.4em;
            color: #4E73DF;
            font-weight: 700;
        }

        .submit-btn {
            background: #1cc88a;
            color: white;
            padding: 1em 2em;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 2em;
            width: 100%;
            font-weight: 700;
        }

        .submit-btn:hover {
            background: #17a673;
        }
    </style>
</head>

<body>

<div class="form-container">
    <h1>Application Form</h1>
    <p class="subtitle">
        Great to meet you! Please fill out your application below and our team will follow up shortly.
    </p>

    <form>

        <!-- PERSONAL INFORMATION -->
        <div class="form-section-title">Personal Information</div>

        <label>Student Date of Birth</label>
        <input type="date" required>

        <label>Student Country Code</label>
        <select required>
            <option value="">Select...</option>
            <option>+1 (USA/Canada)</option>
            <option>+44 (UK)</option>
            <option>+353 (Ireland)</option>
            <option>+65 (Singapore)</option>
            <option>+91 (India)</option>
            <option>+971 (UAE)</option>
        </select>

        <label>Student Phone Number</label>
        <input type="text" placeholder="650-XXX-XXXX" required>

        <label>Guardian Name</label>
        <input type="text" placeholder="Full Name" required>

        <label>Guardian Email</label>
        <input type="email" placeholder="example@email.com" required>

        <label>Guardian Country Code</label>
        <select required>
            <option value="">Select...</option>
            <option>+1 (USA/Canada)</option>
            <option>+44 (UK)</option>
            <option>+353 (Ireland)</option>
            <option>+65 (Singapore)</option>
            <option>+91 (India)</option>
            <option>+971 (UAE)</option>
        </select>

        <label>Guardian Phone Number</label>
        <input type="text" placeholder="650-XXX-XXXX">

        <label>Grade Level (2025–2026)</label>
        <select required>
            <option value="">Select grade...</option>
            <option>Grade 8</option>
            <option>Grade 9</option>
            <option>Grade 10</option>
            <option>Grade 11</option>
            <option>Grade 12</option>
        </select>

        <label>City</label>
        <input type="text" placeholder="City of residence" required>

        <label>School Name</label>
        <input type="text" placeholder="Type your school..." required>

        <label>School Guidance Counselor</label>
        <input type="text" placeholder="Full name or 'N/A'">

        <label>Independent College Counselor</label>
        <input type="text" placeholder="Full name and organization, or 'N/A'">


        <!-- BACKGROUND -->
        <div class="form-section-title">Background & Interests</div>

        <label>Programming Experience (1–5)</label>
        <select required>
            <option value="">Select...</option>
            <option>1 – No programming experience</option>
            <option>2</option>
            <option>3 – Some small projects</option>
            <option>4</option>
            <option>5 – Significant experience, multiple projects</option>
        </select>

        <label>If you have prior programming experience, describe it briefly</label>
        <textarea placeholder="Languages, projects, courses, etc."></textarea>

        <label>Domains you are interested in applying AI to</label>
        <textarea placeholder="Healthcare, NLP, robotics, climate, finance, etc."></textarea>

        <label>Why are you interested in joining the program? (Recommended: 150 words)</label>
        <textarea required></textarea>


        <!-- PROGRAM SELECTION -->
        <div class="form-section-title">Program Selection</div>

        <label>Which upcoming session are you applying for?</label>
        <select required>
            <option value="">Select...</option>
            <option>Winter 2025</option>
            <option>Spring 2026</option>
            <option>Summer 2026</option>
        </select>

        <label>Which aspects of the program are most exciting to you?</label>
        <textarea></textarea>

        <label>How did you hear about us?</label>
        <textarea placeholder="Teacher, counselor, student, Instagram, etc."></textarea>

        <label>If referred by a teacher/counselor, please provide their name</label>
        <input type="text">

        <label>Anything else you'd like to share?</label>
        <textarea></textarea>

        <button class="submit-btn">Submit Application</button>

    </form>

</div>

</body>
</html>
