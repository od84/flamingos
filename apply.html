<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now | AI Research Mentoring</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="assets/style.css">

    <style>
        body {
            background: #f8f9ff;
            font-family: 'Roboto', sans-serif;
        }

        .form-container {
            max-width: 820px;
            margin: 2em auto;
            background: white;
            padding: 2.5em;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #4E73DF;
            margin-bottom: 0.5em;
        }

        p.subtitle {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 2em;
            color: #555;
        }

        form label {
            font-weight: 600;
            display: block;
            margin-top: 1.2em;
        }

        form input, form select, form textarea {
            width: 100%;
            padding: 0.9em;
            margin-top: 0.4em;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
            font-family: inherit;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        .form-section-title {
            font-size: 1.3em;
            margin-top: 2.4em;
            color: #4E73DF;
            font-weight: 700;
        }

        .submit-btn {
            background: #1cc88a;
            color: white;
            padding: 1em 2em;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 2em;
            width: 100%;
            font-weight: 700;
        }

        .submit-btn:hover {
            background: #17a673;
        }

        .success-message {
            padding: 1.2em;
            background: #d4f8e8;
            color: #0b6b3a;
            border-radius: 8px;
            text-align: center;
            margin-top: 1.5em;
            display: none;
            font-size: 1.05em;
        }
    </style>
</head>

<body>

<div class="form-container">
    <h1>Application Form</h1>
    <p class="subtitle">
        Great to meet you! Please fill out your application below and our team will follow up shortly.
    </p>

    <!-- ⭐ APPLICATION FORM ⭐ -->
    <form id="applyForm" action="https://formspree.io/f/xananvqn" method="POST">

        <!-- REQUIRED FIX: NO REDIRECT -->
        <input type="hidden" name="_redirect" value="false">
        <input type="hidden" name="_captcha" value="false">

        <!-- PERSONAL INFORMATION -->
        <div class="form-section-title">Personal Information</div>

        <label>Student Date of Birth</label>
        <input type="date" name="dob" required>

        <label>Student Country Code</label>
        <select name="student_country_code" required>
            <option value="">Select...</option>
            <option>+1 (USA/Canada)</option>
            <option>+44 (UK)</option>
            <option>+353 (Ireland)</option>
            <option>+65 (Singapore)</option>
            <option>+91 (India)</option>
            <option>+971 (UAE)</option>
        </select>

        <label>Student Phone Number</label>
        <input type="text" name="student_phone" placeholder="650-XXX-XXXX" required>

        <label>Guardian Name</label>
        <input type="text" name="guardian_name" placeholder="Full Name" required>

        <label>Guardian Email</label>
        <input type="email" name="guardian_email" placeholder="example@email.com" required>

        <label>Guardian Country Code</label>
        <select name="guardian_country_code" required>
            <option value="">Select...</option>
            <option>+1 (USA/Canada)</option>
            <option>+44 (UK)</option>
            <option>+353 (Ireland)</option>
            <option>+65 (Singapore)</option>
            <option>+91 (India)</option>
            <option>+971 (UAE)</option>
        </select>

        <label>Guardian Phone Number</label>
        <input type="text" name="guardian_phone" placeholder="650-XXX-XXXX">

        <label>Grade Level (2025–2026)</label>
        <select name="grade" required>
            <option value="">Select grade...</option>
            <option>Grade 8</option>
            <option>Grade 9</option>
            <option>Grade 10</option>
            <option>Grade 11</option>
            <option>Grade 12</option>
        </select>

        <label>City</label>
        <input type="text" name="city" placeholder="City of residence" required>

        <label>School Name</label>
        <input type="text" name="school" placeholder="Type your school..." required>

        <label>School Guidance Counselor</label>
        <input type="text" name="counselor" placeholder="Full name or 'N/A'">

        <label>Independent College Counselor</label>
        <input type="text" name="independent_counselor" placeholder="Full name and organization, or 'N/A'">


        <!-- BACKGROUND & INTERESTS -->
        <div class="form-section-title">Background & Interests</div>

        <label>Programming Experience (1–5)</label>
        <select name="experience_level" required>
            <option value="">Select...</option>
            <option>1 – No programming experience</option>
            <option>2</option>
            <option>3 – Some small projects</option>
            <option>4</option>
            <option>5 – Strong experience</option>
        </select>

        <label>If you have prior programming experience, describe it briefly</label>
        <textarea name="programming_background" placeholder="Languages, projects, courses, etc."></textarea>

        <label>Domains you are interested in applying AI to</label>
        <textarea name="ai_domains" placeholder="Healthcare, NLP, Robotics, Climate..."></textarea>

        <label>Why are you interested in joining the program? (Recommended: 150 words)</label>
        <textarea name="why_join" required></textarea>


        <!-- PROGRAM SELECTION -->
        <div class="form-section-title">Program Selection</div>

        <label>Which upcoming session are you applying for?</label>
        <select name="session" required>
            <option value="">Select…</option>
            <option>Winter 2025</option>
            <option>Spring 2026</option>
            <option>Summer 2026</option>
        </select>

        <label>Which aspects of the program are most exciting to you?</label>
        <textarea name="exciting_aspects"></textarea>

        <label>How did you hear about us?</label>
        <textarea name="referral_source" placeholder="Teacher, counselor, Instagram, friend, etc."></textarea>

        <label>If referred by a teacher/counselor, please provide their name</label>
        <input type="text" name="referral_contact">

        <label>Anything else you'd like to share?</label>
        <textarea name="extra_notes"></textarea>

        <button class="submit-btn" type="submit">Submit Application</button>

    </form>

    <!-- SUCCESS MESSAGE -->
    <div id="success" class="success-message">
        ✔ Your application has been submitted! We will contact you shortly.
    </div>

</div>

<!-- ⭐ JAVASCRIPT HANDLER (NO REDIRECT + SUCCESS MESSAGE) ⭐ -->
<script>
    const form = document.getElementById("applyForm");
    const successMessage = document.getElementById("success");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
            form.reset();
            successMessage.style.display = "block";

            // Prevent back button from re-triggering redirect
            history.replaceState(null, null, window.location.href);
        }
    });
</script>

</body>
</html>
